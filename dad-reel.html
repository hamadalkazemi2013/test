<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thank You Dad</title>
<style>
  :root{--ui:#fff;--shadow:rgba(0,0,0,.55);color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0b0f;touch-action:manipulation;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
    -webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
  .reel{position:relative;height:min(100vh,177.78vw);height:min(100dvh,177.78vw);aspect-ratio:9/16;
    background:#000;overflow:hidden;container-type:size;box-shadow:0 0 60px rgba(0,0,0,.6)}
  @media (min-aspect-ratio:10/16){.reel{border-radius:18px;height:min(96vh,177.78vw);height:min(96dvh,177.78vw)}}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .top{position:absolute;left:0;right:0;top:0;padding:2.2cqh 3cqw 6cqh;
    background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
  .bars{display:flex;gap:.8cqw}
  .bars i{flex:1;height:.45cqh;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden}
  .bars b{display:block;height:100%;width:0;background:#fff}
  .prof{display:flex;align-items:center;gap:2cqw;margin-top:1.6cqh;font-size:1.75cqh;font-weight:600;text-shadow:0 1px 3px var(--shadow)}
  .av{width:4.2cqh;height:4.2cqh;border-radius:50%;padding:.3cqh;
    background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
  .av span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
    background:#1fae7a;border:.3cqh solid #000;box-sizing:border-box;font-size:2.2cqh}
  .follow{border:1px solid rgba(255,255,255,.8);border-radius:8px;padding:.4cqh 1.6cqw;font-size:1.5cqh;font-weight:600}
  .side{position:absolute;right:2.5cqw;bottom:13cqh;display:flex;flex-direction:column;align-items:center;gap:2.6cqh;
    font-size:1.45cqh;font-weight:600;text-shadow:0 1px 3px var(--shadow)}
  .side button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.5cqh}
  .side svg{width:3.4cqh;height:3.4cqh;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
    filter:drop-shadow(0 1px 2px var(--shadow));transition:transform .15s}
  .side button:active svg{transform:scale(.85)}
  .side .liked svg{fill:#ff3040;stroke:#ff3040}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:8cqh 16cqw 3cqh 3.5cqw;
    background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:1.6cqh;line-height:1.35;pointer-events:none;text-shadow:0 1px 3px var(--shadow)}
  .bottom b{margin-right:1.5cqw}
  .tag{color:#e0f1ff}
  .audio{margin-top:1cqh;font-size:1.45cqh;opacity:.95;white-space:nowrap;overflow:hidden}
  .audio span{display:inline-block;animation:mq 9s linear infinite}
  @keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .overlay{appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;font:inherit;color:#fff;width:100%;height:100%;touch-action:manipulation;z-index:5;
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqh;
    background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer;text-align:center}
  .overlay .btn{width:11cqh;height:11cqh;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.85);
    display:flex;align-items:center;justify-content:center;font-size:4.5cqh}
  .overlay p{margin:0;font-size:1.9cqh;font-weight:600}
  .overlay small{font-size:1.45cqh;opacity:.8}
  .hidden{display:none}
  .pauseIco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7cqh;opacity:0;pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.6);transition:opacity .2s}
  .pauseIco.show{opacity:.9}
  .bigHeart{position:absolute;width:16cqh;height:16cqh;pointer-events:none;animation:pop .9s ease-out forwards}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}
    25%{transform:translate(-50%,-50%) scale(1.15) rotate(-12deg);opacity:1}
    45%{transform:translate(-50%,-50%) scale(.95) rotate(-12deg)}
    100%{transform:translate(-50%,-90%) scale(1) rotate(-12deg);opacity:0}}
  .mute{position:absolute;right:3cqw;top:9cqh;width:4cqh;height:4cqh;border-radius:50%;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;font-size:2cqh;cursor:pointer;border:0;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="reel" id="reel">
    <canvas id="c"></canvas>

    <div class="top">
      <div class="bars" id="bars"></div>
      <div class="prof">
        <div class="av"><span>👨</span></div>
        <span>dad.appreciation</span>
        <span class="follow">Follow</span>
      </div>
    </div>

    <button class="mute" id="mute" aria-label="Toggle sound">🔊</button>
    <div class="pauseIco" id="pauseIco">❚❚</div>

    <div class="side">
      <button id="likeBtn" aria-label="Like">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.6-4.6-9.5-9.3C1.1 7.8 3.3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.6 2.7.9-1.6 2.5-2.7 4.6-2.7 3.4 0 5.6 3.3 4.2 6.7-1.9 4.7-8.1 9.3-8.1 9.3z"/></svg>
        <span id="likes">1.2M</span>
      </button>
      <button aria-label="Comments">
        <svg viewBox="0 0 24 24"><path d="M20.7 12a8.7 8.7 0 0 1-12.9 7.6L3 21l1.4-4.6A8.7 8.7 0 1 1 20.7 12z"/></svg>
        <span>18.4K</span>
      </button>
      <button aria-label="Share">
        <svg viewBox="0 0 24 24"><path d="M21.5 3 10 13.2M21.5 3l-6.8 18-4.7-7.8L2.5 9.6z"/></svg>
        <span>92.1K</span>
      </button>
      <button aria-label="Save">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5.5L5 21V4.5A1.5 1.5 0 0 1 6.5 3h11A1.5 1.5 0 0 1 19 4.5z"/></svg>
      </button>
    </div>

    <div class="bottom">
      <div><b>dad.appreciation</b>He'll never ask for a thank you, so say it anyway 🥹💙 Tag someone who needs to call their dad.
        <span class="tag">#dad #father #family #stickman #reels</span></div>
      <div class="audio"><span>♪ original audio · dad.appreciation &nbsp;&nbsp;&nbsp; ♪ original audio · dad.appreciation &nbsp;&nbsp;&nbsp;</span></div>
    </div>

    <button type="button" class="overlay" id="start">
      <div class="btn">▶</div>
      <p>Tap to play</p>
      <small>30 sec · sound on 🔊</small>
    </button>
    <button type="button" class="overlay hidden" id="end">
      <div class="btn">↻</div>
      <p>Watch again</p>
      <small>Now go thank him 💙</small>
    </button>
  </div>
</div>

<script>
(() => {
const W = 540, H = 960, G = 790;          // logical canvas size + ground line
const DUR = 30, SCN = 5;
const MOM = '#ff5d8f', HAIR = '#6b2443', KID = '#3d8bff', WHITE = '#f3f3f3';

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
function resize(){
  const r = cvs.getBoundingClientRect();
  if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const k = (r.width * dpr) / W;
  cvs.width = Math.round(W * k); cvs.height = Math.round(H * k);
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
window.addEventListener('resize', () => { resize(); render(T); });

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = (t, a, b) => ease(prog(t, a, b));
const L2 = (p, q, t) => ({ x: lerp(p.x, q.x, t), y: lerp(p.y, q.y, t) });
const backOut = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const PI = Math.PI;

/* ---------- colour ---------- */
function rgb(h){ h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function shade(h, a){
  const c = rgb(h).map(v => a < 0 ? v * (1 + a) : v + (255 - v) * a);
  return `rgb(${c.map(v => Math.round(clamp(v, 0, 255))).join(',')})`;
}

/* ---------- 3D-ish primitives ---------- */
function seg(a, b){ ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
function tube(a, b, w, hex, dim = 0){
  ctx.lineCap = 'round';
  ctx.strokeStyle = shade(hex, dim - .38); ctx.lineWidth = w; seg(a, b);
  const o = w * .12;
  ctx.strokeStyle = shade(hex, dim); ctx.lineWidth = w * .7;
  seg({ x: a.x - o, y: a.y - o }, { x: b.x - o, y: b.y - o });
  const o2 = w * .2;
  ctx.strokeStyle = shade(hex, dim + .5); ctx.lineWidth = w * .2;
  seg({ x: a.x - o2, y: a.y - o2 }, { x: b.x - o2, y: b.y - o2 });
}
function sphere(x, y, r, hex, dim = 0){
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .08, x, y, r);
  g.addColorStop(0, shade(hex, dim + .65)); g.addColorStop(.45, shade(hex, dim)); g.addColorStop(1, shade(hex, dim - .5));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, PI * 2); ctx.fill();
}
function shadow(x, y, rx, a = .35){
  ctx.save(); ctx.translate(x, y); ctx.scale(1, .22);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, PI * 2); ctx.fill(); ctx.restore();
}
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function box3(x, y, w, h, d, hex){            // simple extruded box: front face + top + side
  ctx.fillStyle = shade(hex, .25);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d, y - d * .6); ctx.lineTo(x + w + d, y - d * .6); ctx.lineTo(x + w, y); ctx.fill();
  ctx.fillStyle = shade(hex, -.3);
  ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w + d, y - d * .6); ctx.lineTo(x + w + d, y + h - d * .6); ctx.lineTo(x + w, y + h); ctx.fill();
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, hex); g.addColorStop(1, shade(hex, -.2));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
}
function heart(x, y, s, hex){
  const g = ctx.createRadialGradient(x - s * .3, y - s * .3, s * .1, x, y, s * 1.2);
  g.addColorStop(0, shade(hex, .6)); g.addColorStop(.5, hex); g.addColorStop(1, shade(hex, -.4));
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(x, y + s * .9);
  ctx.bezierCurveTo(x - s * 1.3, y + s * .05, x - s * .75, y - s * 1, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .75, y - s * 1, x + s * 1.3, y + s * .05, x, y + s * .9);
  ctx.fill();
}
function hearts(t, t0, n, cx, cy, spread, hex = '#ff3b6b'){
  for (let i = 0; i < n; i++){
    const a = t - (t0 + i * .2);
    if (a < 0 || a > 2.4) continue;
    ctx.globalAlpha = clamp(Math.min(a * 4, 1 - a / 2.4));
    heart(cx + (rnd(i) - .5) * spread + Math.sin(a * 3 + i) * 10, cy - a * 95, 9 + rnd(i + 7) * 9, hex);
  }
  ctx.globalAlpha = 1;
}
function confetti(t, t0, n, cx, cy){
  const cols = ['#ffd84d', '#ff5d8f', '#3d8bff', '#4ee38a', '#ffffff', '#b06cff'];
  for (let i = 0; i < n; i++){
    const a = t - t0; if (a < 0) return;
    const vx = (rnd(i) - .5) * 520, vy = -260 - rnd(i + 3) * 420;
    const x = cx + vx * a, y = cy + vy * a + 520 * a * a;
    if (y > H + 20) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a * (4 + rnd(i) * 8)); ctx.scale(1, Math.cos(a * 9 + i));
    ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-5, -3, 10, 6); ctx.restore();
  }
}

/* ---------- IK + stickman rig ---------- */
function ik(a, t, l1, l2, bend){
  const dx = t.x - a.x, dy = t.y - a.y;
  const d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + .01, l1 + l2 - .01);
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const k = { x: a.x + Math.cos(ang - A * bend) * l1, y: a.y + Math.sin(ang - A * bend) * l1 };
  const e = { x: a.x + Math.cos(ang) * d, y: a.y + Math.sin(ang) * d };
  return [k, e];
}
function face(h, R, f, mood){
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = '#1b1030'; ctx.lineWidth = Math.max(1.6, R * .13); ctx.lineCap = 'round';
  const ex = [h.x + f * R * .1, h.x + f * R * .55], ey = h.y - R * .1;
  for (const x of ex){
    ctx.beginPath();
    if (mood === 'content') ctx.arc(x, ey + R * .08, R * .15, PI * 1.15, PI * 1.85);
    else if (mood === 'sleep') ctx.arc(x, ey - R * .05, R * .14, PI * .15, PI * .85);
    else { ctx.ellipse(x, ey, R * .1, R * .14, 0, 0, PI * 2); ctx.fill(); continue; }
    ctx.stroke();
  }
  const mx = h.x + f * R * .35, my = h.y + R * .35;
  ctx.beginPath();
  if (mood === 'sad') ctx.arc(mx, my + R * .15, R * .17, PI * 1.2, PI * 1.8);
  else if (mood === 'wow'){ ctx.ellipse(mx, my, R * .1, R * .14, 0, 0, PI * 2); ctx.fill(); ctx.restore(); return; }
  else if (mood === 'neutral' || mood === 'sleep'){ ctx.moveTo(mx - R * .12, my); ctx.lineTo(mx + R * .12, my); }
  else ctx.arc(mx, my - R * .12, R * .22, PI * .15, PI * .85);
  ctx.stroke();
  if (mood === 'happy' || mood === 'content'){
    ctx.fillStyle = 'rgba(255,120,150,.45)';
    ctx.beginPath(); ctx.arc(h.x + f * R * .7, h.y + R * .18, R * .16, 0, PI * 2); ctx.fill();
  }
  ctx.restore();
}
function hairCap(h, R, f){
  sphere(h.x - f * R * .8, h.y - R * .35, R * .52, HAIR);        // bun
}
function hairTop(h, R, f){
  ctx.save(); ctx.translate(h.x, h.y); ctx.scale(f, 1);
  const g = ctx.createLinearGradient(0, -R, 0, R * .4);
  g.addColorStop(0, shade(HAIR, .3)); g.addColorStop(1, shade(HAIR, -.3));
  ctx.fillStyle = g; ctx.beginPath();
  ctx.arc(0, 0, R * 1.06, PI * .72, PI * 1.82);
  ctx.quadraticCurveTo(R * .1, -R * .55, -R * .45, -R * .05);
  ctx.quadraticCurveTo(-R * .7, R * .3, -R * .75, R * .7);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/*
  man(o): draws a shaded stick figure.
  o.x, o.y: hip x / ground y.  o.hipY overrides hip height (sitting/biking).
  pose angles are absolute, 0 = straight down, + = toward facing direction.
  la/ll = far arm/leg (drawn darker, behind), ra/rl = near arm/leg.
  o.hands / o.feet = IK targets [far, near].
*/
function man(o){
  const s = o.s || 1, f = o.f || 1, c = o.col, p = o.pose || {};
  const lean = p.lean || 0, tilt = p.tilt || 0;
  const T = 58 * s, TH = 38 * s, SH = 38 * s, UA = 30 * s, FA = 28 * s, R = 17 * s, w = 9 * s;
  const P = (q, a, len) => ({ x: q.x + Math.sin(a) * len * f, y: q.y + Math.cos(a) * len });
  const ll = p.ll || [.1, .05], rl = p.rl || [-.1, -.05];
  let hipY;
  if (o.hipY != null) hipY = o.hipY;
  else {
    const lh = l => Math.cos(l[0]) * TH + Math.cos(l[1]) * SH;
    hipY = o.y - Math.max(lh(ll), lh(rl)) - (o.lift || 0);
  }
  const hip = { x: o.x, y: hipY };
  const neck = { x: hip.x + Math.sin(lean) * T * f, y: hip.y - Math.cos(lean) * T };
  const sh = L2(hip, neck, .86);
  const ha = lean + tilt;
  const head = { x: neck.x + Math.sin(ha) * (R + 2 * s) * f, y: neck.y - Math.cos(ha) * (R + 2 * s) };
  const limb = (root, ang, tgt, l1, l2, bend) => {
    if (tgt) return ik(root, tgt, l1, l2, bend);
    const k = P(root, ang[0], l1); return [k, P(k, ang[1], l2)];
  };
  const H_ = o.hands || [], F_ = o.feet || [];
  const [bk, bf] = limb(hip, ll, F_[0], TH, SH, f);
  const [fk, ff] = limb(hip, rl, F_[1], TH, SH, f);
  const [be, bh] = limb(sh, p.la || [.25, .1], H_[0], UA, FA, -f);
  const [fe, fh] = limb(sh, p.ra || [-.2, -.05], H_[1], UA, FA, -f);
  const pts = { hip, neck, sh, head, bh, fh, bf, ff, R };
  if (o.dry) return pts;

  if (o.only === 'farm'){ tube(sh, fe, w * .9, c); tube(fe, fh, w * .9, c); sphere(fh.x, fh.y, w * .55, c); return pts; }

  if (!o.noShadow){
    const gy = o.gy != null ? o.gy : o.y;
    shadow(hip.x + Math.sin(lean) * 12 * f, gy, 44 * s, .35 * (1 - clamp((o.lift || 0) / 80) * .6));
  }
  const D = -.3;
  tube(hip, bk, w, c, D); tube(bk, bf, w, c, D);
  if (!o.noBackArm){ tube(sh, be, w * .9, c, D); tube(be, bh, w * .9, c, D); sphere(bh.x, bh.y, w * .55, c, D); }

  if (o.dress){
    const dx = neck.x - hip.x, dy = neck.y - hip.y, dl = Math.hypot(dx, dy);
    const ux = dx / dl, uy = dy / dl, px = -uy, py = ux;
    const top = L2(hip, neck, .82), bot = { x: hip.x - ux * 18 * s, y: hip.y - uy * 18 * s };
    const g = ctx.createLinearGradient(bot.x - px * 30 * s, bot.y - py * 30 * s, bot.x + px * 30 * s, bot.y + py * 30 * s);
    g.addColorStop(0, shade(c, .25)); g.addColorStop(.5, c); g.addColorStop(1, shade(c, -.4));
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(top.x + px * 8 * s, top.y + py * 8 * s); ctx.lineTo(top.x - px * 8 * s, top.y - py * 8 * s);
    ctx.lineTo(bot.x - px * 28 * s, bot.y - py * 28 * s);
    ctx.quadraticCurveTo(bot.x - ux * 6 * s, bot.y - uy * 6 * s + 6 * s, bot.x + px * 28 * s, bot.y + py * 28 * s);
    ctx.closePath(); ctx.fill();
    tube(L2(hip, neck, .7), neck, w * 1.15, c);
  } else tube(hip, neck, w * 1.2, c);

  tube(hip, fk, w, c); tube(fk, ff, w, c);
  if (o.backpack){
    const bp = L2(hip, neck, .55);
    ctx.save(); ctx.translate(bp.x - f * 9 * s, bp.y); ctx.rotate(lean * f);
    rr(-9 * s, -14 * s, 18 * s, 28 * s, 5 * s); ctx.fillStyle = o.backpack; ctx.fill(); ctx.restore();
  }
  if (o.hair) hairCap(head, R, f);
  sphere(head.x, head.y, R, c);
  if (o.hair) hairTop(head, R, f);
  if (o.short) shortHair(head, R, f, o.short);
  if (o.beard) beard(head, R, f, o.beard);
  face(head, R, f, o.mood || 'happy');
  if (o.mid) o.mid(pts);
  if (!o.noFrontArm){ tube(sh, fe, w * .9, c); tube(fe, fh, w * .9, c); sphere(fh.x, fh.y, w * .55, c); }
  return pts;
}

function gait(ph, amp, lean, armBend){
  const leg = q => { const a = Math.sin(q) * amp; return [a, a - (.15 + amp * 1.1 * Math.max(0, Math.cos(q)))]; };
  const arm = q => { const a = -Math.sin(q) * amp * .8; return [a, a + armBend]; };
  return { lean, ll: leg(ph), rl: leg(ph + PI), la: arm(ph), ra: arm(ph + PI) };
}

    ctx.save(); ctx.translate(dx, 0); ctx.scale(Math.cos(a) || .001, 1); ctx.translate(-dx, 0);
    const kd = { x: dx + 28, hipY: G - 152 + Math.sin(a * 2) * 5, gy: G, noShadow: 1, s: .7, f: 1, col: KID, mood: 'content',

}

// 5 — El Clásico on the couch
function popcorn(t, t0, cx, cy){
  const a = t - t0; if (a < 0) return;
  for (let i = 0; i < 26; i++){
    const x = cx + (rnd(i) - .5) * 300 * a, y = cy + (-240 - rnd(i + 9) * 260) * a + 520 * a * a;
    if (y > G + 10) continue;
    sphere(x, y, 4 + rnd(i + 2) * 3, i % 4 ? '#fff4d6' : '#ffd36b');
  }
}
function s5(t){
  sky('#1b1534', '#0f0c20');
  ctx.save(); rr(60, 230, 130, 150, 8); ctx.clip(); sky('#070a22', '#1d2260');
  for (let i = 0; i < 14; i++){ ctx.fillStyle = `rgba(255,255,255,${.3 + .7 * Math.abs(Math.sin(t * 2 + i))})`; ctx.fillRect(60 + rnd(i + 3) * 130, 230 + rnd(i + 30) * 150, 2, 2); }
  ctx.restore(); ctx.strokeStyle = '#3d3566'; ctx.lineWidth = 8; rr(60, 230, 130, 150, 8); ctx.stroke();

  ctx.save(); rr(362, G - 217, 168, 112, 4); ctx.clip();
  const pg = ctx.createLinearGradient(0, G - 217, 0, G - 105); pg.addColorStop(0, '#2f8f3c'); pg.addColorStop(1, '#4cbf5a');
  ctx.fillStyle = pg; ctx.fillRect(362, G - 217, 168, 112);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 1; i < 6; i += 2) ctx.fillRect(362 + i * 28, G - 217, 28, 112);
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; seg({ x: 446, y: G - 217 }, { x: 446, y: G - 105 });
  ctx.beginPath(); ctx.arc(446, G - 161, 16, 0, PI * 2); ctx.stroke();
  for (let i = 0; i < 5; i++){
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(380 + rnd(i) * 130 + Math.sin(t * 2 + i) * 14, G - 200 + rnd(i + 20) * 85 + Math.cos(t * 1.7 + i) * 8, 4, 0, PI * 2); ctx.fill();
    ctx.fillStyle = '#b5123a'; ctx.beginPath(); ctx.arc(380 + rnd(i + 40) * 130 + Math.cos(t * 2 + i) * 14, G - 200 + rnd(i + 60) * 85 + Math.sin(t * 1.5 + i) * 8, 4, 0, PI * 2); ctx.fill();

  if (goal && Math.floor(t * 4) % 2 === 0){ ctx.fillStyle = '#ffd84d'; ctx.font = '900 30px Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GOAL!', 446, G - 148); }
  ctx.restore();
  // couch
  box3(18, G - 150, 34, 104, 12, '#6a36b0');
  box3(40, G - 62, 230, 30, 16, '#8a4ad0');
  box3(40, G - 32, 230, 32, 16, '#5d2f99');

  if (!goal){
    const tense = E(t, 1.2, 2.2);
    man(Object.assign({ x: 105, hipY: G - 68, gy: G, s: 1.05, f: 1, mood: tense > .5 ? 'wow' : 'happy', pose: { lean: lerp(-.15, .3, tense) },
      feet: [{ x: 150, y: G }, { x: 160, y: G }], hands: [{ x: 135, y: G - 72 }, { x: 142, y: G - 84 }] }, dadLook));
    box3(128, G - 86, 30, 16, 6, '#e8343f');
    for (let i = 0; i < 6; i++) sphere(132 + i * 4.5, G - 88 - (i % 2) * 3, 3.5, '#fff4d6');
    man({ x: 190, hipY: G - 68, gy: G, s: .9, f: 1, col: KID, mood: tense > .5 ? 'wow' : 'happy', pose: { lean: lerp(-.1, .45, tense) },
      feet: [{ x: 225, y: G }, { x: 235, y: G }], hands: [{ x: 218, y: G - 72 }, { x: 226, y: G - 70 }] });
  } else {
    const g2 = t - 2.4, jumping = t < 3.8, w = Math.sin(t * 14);
    const arms = s => ({ la: [2.8 + w * .2 * s, 3.0], ra: [2.6 - w * .2 * s, 2.9], ll: [.3, -.2], rl: [-.3, -.6] });
    const dO = Object.assign({ x: 105, y: G, s: 1.05, f: 1, mood: jumping ? 'wow' : 'content', lift: jumping ? Math.abs(Math.sin(g2 * 7)) * 34 : 0,
      pose: jumping ? arms(1) : { lean: .05 } }, dadLook);
    man(Object.assign({ noFrontArm: !jumping }, dO));
    const tp = man({ x: 200, y: G, s: .9, f: 1, col: KID, mood: jumping ? 'wow' : 'content', lift: jumping ? Math.abs(Math.sin(g2 * 7 + 1)) * 34 : 0,
      pose: jumping ? arms(-1) : { lean: 0, ra: [2.6, 3.0 + Math.sin(t * 10) * .2] } });
    if (!jumping) man(Object.assign({}, dO, { only: 'farm', hands: [null, { x: tp.sh.x + 10, y: tp.sh.y - 2 }] }));
    popcorn(t, 2.4, 140, G - 90);
    confetti(t, 2.45, 50, 270, 520);

}

// 6 — Kuwait Towers at sunset

function s6(t){
  sky('#3a2a7a', '#ff9a5a');
  glow(190, 610, 330, 'rgba(255,215,150,.55)'); sphere(190, 615, 78, '#ffd27a', .1);

    ctx.beginPath(); ctx.moveTo(x - 12, y - fl); ctx.quadraticCurveTo(x - 4, y - 6, x, y); ctx.quadraticCurveTo(x + 4, y - 6, x + 12, y - fl); ctx.stroke();
  }
  kuwaitTowers();
  const sg = ctx.createLinearGradient(0, 625, 0, 690); sg.addColorStop(0, '#c86a8a'); sg.addColorStop(1, '#6a3a7a');
  ctx.fillStyle = sg; ctx.fillRect(-80, 625, W + 160, 70);
  ctx.fillStyle = 'rgba(255,220,150,.6)';
  for (let i = 0; i < 7; i++){ const w = 90 - i * 10; ctx.fillRect(190 - w / 2 + Math.sin(t * 2 + i) * 6, 632 + i * 8, w, 3); }
  floor(690, '#e8a877', '#8a4f5a', 'rgba(255,255,255,.08)');

    pose: hug ? { lean: .12, tilt: .3 } : bump ? { lean: .05 } : walk(t * 8),

  if (hug) man(Object.assign({}, dO, { only: 'farm' }));
  burst(fist.x, fist.y, prog(t, 2.05, 2.6), '#ffe680');

  if (t > 2.7){ const p = backOut(prog(t, 2.7, 3.1)); ctx.save(); ctx.translate(275, G - 300); ctx.scale(p, p); heart(0, 0, 40, '#3d7bff'); ctx.restore(); }
}

const SCENES = [s1, s2, s3, s4, s5, s6];
const CAPS = [
  [0.2, 2.6, 'When you were small...'],
  [2.6, 5.0, '...he made you feel 10 feet tall 🎈'],
  [5.2, 7.6, 'He "tried" to save it...'],
  [7.6, 10, 'He let you win. Every. Single. Time. 😂'],
  [10.2, 12.6, 'He taught you how things work 🔧'],
  [12.6, 15, '...and let you take the credit 🚗💨'],
  [15.2, 17.4, 'Long day at work...'],
  [17.4, 20, '...still had energy for you ✈️'],
  [20.2, 22.5, "Every Clásico. Same couch. 📺"],
  [22.5, 25, 'HALA MADRID! 🤍'],
  [25.2, 27.6, "He never said it much..."],
  [27.6, 30, '...but he showed it every day. Go thank your dad 💙'],
];

/* ---------- captions (IG style per-line white pills) ---------- */
function wrapText(text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words){ const tst = cur ? cur + ' ' + w : w; if (ctx.measureText(tst).width > maxW && cur){ lines.push(cur); cur = w; } else cur = tst; }
  if (cur) lines.push(cur); return lines;
}
function caption(T){
  for (const [a, b, text] of CAPS){
    if (T < a || T > b) continue;
    const k = prog(T, a, a + .35), out = prog(T, b - .2, b);
    const sc = k < 1 ? backOut(k) : 1;
    ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(W / 2, 205); ctx.scale(sc, sc);
    ctx.font = '800 29px -apple-system, "Segoe UI", Roboto, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = wrapText(text, 400), lh = 44;
    lines.forEach((ln, i) => {
      const w = ctx.measureText(ln).width + 28, y = i * lh;
      ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(-w / 2 + 3, y - 20 + 4, w, 40, 10); ctx.fill();
      ctx.fillStyle = '#fff'; rr(-w / 2, y - 20, w, 40, 10); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillText(ln, 0, y + 1);
    });
    ctx.restore();
  }
}

/* ---------- render ---------- */
function render(T){
  const tt = Math.min(T, DUR - 1e-4);
  const i = Math.floor(tt / SCN), lt = tt - i * SCN;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  // slow push-in camera, slight handheld drift
  const z = 1.14 + .06 * (lt / SCN) + (i === 3 && lt > 2.9 ? Math.sin(lt * 40) * .004 * (1 - prog(lt, 2.9, 3.6)) : 0);
  ctx.translate(W / 2 + Math.sin(tt * .7) * 4, G - 40 + Math.cos(tt * .9) * 3); ctx.scale(z, z); ctx.translate(-W / 2, -(G - 40));
  SCENES[i](lt);
  ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  caption(tt);
  // scene transitions
  const fade = Math.max(i > 0 ? 1 - prog(lt, 0, .3) : 1 - prog(lt, 0, .5), i < 5 ? prog(lt, 4.75, 5) : prog(lt, 4.6, 5) * .6);
  if (fade > 0){ ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  bars.forEach((b, k) => b.style.width = (clamp((T - k * SCN) / SCN) * 100) + '%');
}

/* ---------- UI + playback ---------- */
const barsEl = document.getElementById('bars');
const bars = SCENES.map(() => { const i = document.createElement('i'), b = document.createElement('b'); i.appendChild(b); barsEl.appendChild(i); return b; });
const startEl = document.getElementById('start'), endEl = document.getElementById('end');
const pauseIco = document.getElementById('pauseIco'), reel = document.getElementById('reel');
let T = 0, playing = false, last = 0, muted = false;

let lastW = 0;
function loop(now){
  const cw = cvs.clientWidth;
  if (cw && cw !== lastW){ lastW = cw; resize(); }
  if (playing){
    T += clamp((now - last) / 1000, 0, .1);
    if (T >= DUR){ T = DUR; playing = false; endEl.classList.remove('hidden'); }
  }
  last = now; render(startEl.classList.contains("hidden") ? T : 0.8);
  requestAnimationFrame(loop);
}
function play(e){
  if (e) e.preventDefault();
  T = 0; playing = true; last = performance.now();
  startEl.classList.add('hidden'); endEl.classList.add('hidden');
  resize();
  try { startAudio(); } catch (err) {}
}
startEl.addEventListener('click', play); endEl.addEventListener('click', play);

let clickTimer = null;
cvs.addEventListener('click', e => {
  if (clickTimer){ clearTimeout(clickTimer); clickTimer = null; bigHeart(e); return; }
  clickTimer = setTimeout(() => {
    clickTimer = null;
    if (T >= DUR || !startEl.classList.contains('hidden')) return;
    playing = !playing; last = performance.now();
    pauseIco.textContent = playing ? '▶' : '❚❚'; pauseIco.classList.add('show');
    setTimeout(() => pauseIco.classList.remove('show'), playing ? 400 : 99999);
    if (AC) playing ? AC.resume() : AC.suspend();
  }, 260);
});
function bigHeart(e){
  const r = reel.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'bigHeart'; d.style.left = (e.clientX - r.left) + 'px'; d.style.top = (e.clientY - r.top) + 'px';
  d.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="#ff3040" d="M12 20.5s-7.6-4.6-9.5-9.3C1.1 7.8 3.3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.6 2.7.9-1.6 2.5-2.7 4.6-2.7 3.4 0 5.6 3.3 4.2 6.7-1.9 4.7-8.1 9.3-8.1 9.3z"/></svg>';
  reel.appendChild(d); setTimeout(() => d.remove(), 950);
  setLiked(true);
}
const likeBtn = document.getElementById('likeBtn'), likesEl = document.getElementById('likes');
function setLiked(v){ likeBtn.classList.toggle('liked', v); likesEl.textContent = v ? '1.2M' : '1.2M'; }
likeBtn.onclick = () => setLiked(!likeBtn.classList.contains('liked'));
document.getElementById('mute').onclick = e => {
  muted = !muted; e.currentTarget.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : .5;
};

/* ---------- soft piano-ish soundtrack (WebAudio, no files) ---------- */
let AC = null, master = null;
function note(m, start, dur, vol, type){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(vol, start + .02);
  g.gain.exponentialRampToValueAtTime(.0001, start + dur);
  o.connect(g); g.connect(master); o.start(start); o.stop(start + dur + .05);
}
function kick(start){
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(110, start); o.frequency.exponentialRampToValueAtTime(40, start + .18);
  g.gain.setValueAtTime(.35, start); g.gain.exponentialRampToValueAtTime(.0001, start + .22);
  o.connect(g); g.connect(master); o.start(start); o.stop(start + .25);
}
function startAudio(){
  try {
    if (AC) try { AC.close(); } catch (e) {}
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .5;
    const lp = AC.createBiquadFilter(); lp.frequency.value = 2600;
    master.connect(lp); lp.connect(AC.destination);
    const t0 = AC.currentTime + .05, chords = [[55, 59, 62], [50, 54, 57], [52, 55, 59], [48, 52, 55]];
    const step = 2.5 / 8, pat = [0, 1, 2, 3, 2, 1, 2, 1];
    for (let c = 0; c < 12; c++){
      const ch = chords[c % 4], ct = t0 + c * 2.5;
      note(ch[0] - 24, ct, 2.6, .2, 'triangle');
      ch.forEach(m => note(m, ct, 2.4, .035, 'sine'));
      for (let k = 0; k < 4; k++) kick(ct + k * .625);
      for (let k = 0; k < 8; k++){ const m = pat[k] === 3 ? ch[0] + 12 : ch[pat[k]]; note(m + 12, ct + k * step, .7, .07, 'sine'); }
    }
    [43, 55, 59, 62, 67].forEach(m => note(m, t0 + 30, 3, .08, 'sine'));
  } catch (e) { AC = null; }
}

resize();
const seek = /t=([\d.]+)/.exec(location.hash);
if (seek){ T = +seek[1]; startEl.classList.add('hidden'); }
render(0.8);   // poster frame behind the play button
requestAnimationFrame(loop);
})();
